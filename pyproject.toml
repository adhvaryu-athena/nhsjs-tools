[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhsjs-tools"
version = "2.0.0"
description = "Conversion + revision tooling for NHSJS (National High School Journal of Science) manuscripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Athena Education" }]
keywords = ["nhsjs", "manuscript", "docx", "latex", "academic", "revision"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Office/Business",
]

# Library runtime deps. Streamlit is NOT here — it's only needed by the
# web app (see requirements.txt). Importing the converter modules from a
# Cowork bot must not pull Streamlit.
dependencies = [
    "python-docx>=1.1",
    "Pillow>=10.0",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/athena-education/nhsjs-tools"
Issues = "https://github.com/athena-education/nhsjs-tools/issues"

# Console entry points. Lets `pip install nhsjs-tools` users run the
# builders from the shell without writing wrapper scripts.
[project.scripts]
nhsjs-latex-to-online = "nhsjs_convert:main"
nhsjs-standard-to-online = "nhsjs_standard_to_online:_cli"
nhsjs-build-revision = "nhsjs_revision_builder:_cli"
nhsjs-audit-revision = "nhsjs_audit:_cli"

# Flat-layout: ship each top-level .py as its own module.
[tool.setuptools]
py-modules = [
    "nhsjs_convert",
    "nhsjs_standard_to_online",
    "nhsjs_revision_builder",
    "nhsjs_audit",
]
